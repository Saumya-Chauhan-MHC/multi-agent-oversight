<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>oversight</title>
<style>
 :root{--bg:#14161a;--panel:#1b1e24;--line:#2a2f38;--txt:#e6e8ec;--dim:#7d8694;--fit:#3fb950;
       --depart:#f85149;--guess:#58a6ff;--accent:#d29922}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
 header{display:flex;align-items:baseline;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
 header b{font-size:14px} header span{color:var(--dim);font-size:12px}
 .wrap{display:grid;grid-template-columns:1fr 430px;height:calc(100vh - 44px)}
 .graph{overflow:auto;padding:16px 18px}
 .side{border-left:1px solid var(--line);overflow:auto;background:var(--panel)}
 .key{color:var(--dim);font-size:11.5px;padding:0 0 14px;display:flex;gap:16px;flex-wrap:wrap}
 .key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
 .row{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 22px 0}
 .node{position:relative;min-width:188px;max-width:230px;border:1px solid var(--line);border-radius:7px;
       padding:9px 11px;background:#1e222a;cursor:pointer;opacity:.45}
 .node.fresh{opacity:1}
 .node:hover{border-color:#3d4452}
 .node .nm{font-weight:600;font-size:12.5px;margin-bottom:3px}
 .node .meta{color:var(--dim);font-size:11.5px}
 .node .dot{position:absolute;top:-7px;left:-7px;width:16px;height:16px;border-radius:50%;
            font-size:10.5px;line-height:16px;text-align:center;color:#0b0d10;font-weight:700}
 .dot.fits{background:var(--fit)} .dot.departs{background:var(--depart)} .dot.guess{background:var(--guess)}
 .node.done{border-color:#2f6f3f}
 .tag{position:absolute;top:-8px;right:8px;font-size:10px;color:#0b0d10;background:var(--accent);
      border-radius:3px;padding:0 5px}
 .kids{margin-left:26px;border-left:1px dashed var(--line);padding-left:20px}
 h3{margin:16px 14px 8px;font-size:12px;letter-spacing:.4px;color:var(--dim);text-transform:uppercase}
 .item{border-top:1px solid var(--line);padding:12px 14px}
 .item .t{font-weight:600;margin-bottom:4px}
 .item .c{color:#c3c9d3;font-size:12.5px}
 .item .acc{color:var(--dim);font-size:12px;margin-top:6px;font-style:italic}
 .badge{display:inline-block;width:15px;height:15px;border-radius:50%;font-size:10px;line-height:15px;
        text-align:center;color:#0b0d10;font-weight:700;margin-right:6px}
 button{font:inherit;font-size:12px;background:#262b33;color:var(--txt);border:1px solid #39404b;
        border-radius:5px;padding:4px 10px;cursor:pointer;margin:8px 6px 0 0}
 button:hover{border-color:#4d5663} button.pri{border-color:var(--accent);color:var(--accent)}
 textarea{width:100%;margin-top:7px;background:#12151a;color:var(--txt);border:1px solid #39404b;
          border-radius:5px;padding:7px;font:inherit;font-size:12px}
 .lines{padding:4px 14px 14px;color:#c3c9d3;font-size:12px}
 .lines div{padding:2px 0} .lines .id{color:var(--accent);font-family:ui-monospace,Menlo,monospace}
 .sum{padding:10px 14px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
 .empty{color:var(--dim);padding:14px}
</style>
</head>
<body>
<header>
  <b>oversight</b>
  <span id="since">since you last looked</span>
  <span id="counts"></span>
  <span id="mode"></span>
</header>
<div class="wrap">
  <div class="graph">
    <div class="key">
      <span><i class="dot fits"></i>fits</span>
      <span><i class="dot departs"></i>departs from a line you wrote</span>
      <span><i class="dot guess"></i>guess, nothing you said covered it</span>
      <span>dimmed = seen . bright = new since your last look . click a node to open it</span>
    </div>
    <div id="dag"></div>
  </div>
  <div class="side">
    <h3>since you last looked</h3>
    <div id="items"></div>
    <div style="padding:0 14px 16px"><button class="pri" onclick="caughtUp()">caught up</button>
      <span style="color:var(--dim);font-size:12px">nothing to change; resets your last look to now</span></div>
    <h3>your lines</h3>
    <div class="lines" id="lines"></div>
    <div class="sum" id="sum"></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
let S = null;

async function load(){
  S = await (await fetch('/state')).json();
  draw();
}
async function post(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: JSON.stringify(body||{})});
  await r.json(); await load();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function nodeEl(n){
  const d = document.createElement('div');
  d.className = 'node' + (n.new_since_look ? ' fresh' : '') + (n.status === 'done' ? ' done' : '');
  d.onclick = () => post('/look', {node: n.id});
  d.innerHTML =
    (n.mark ? `<span class="dot ${n.mark}">${n.mark==='fits'?'&#10003;':n.mark==='departs'?'!':'?'}</span>` : '') +
    (n.status === 'done' ? '<span class="tag">finished</span>' : '') +
    `<div class="nm">${esc(n.label)}</div>` +
    `<div class="meta">${esc(n.status)}${n.writes.length ? ' . ' + n.writes.length + ' files' : ''}</div>`;
  return d;
}

function draw(){
  const byParent = {};
  S.nodes.forEach(n => { (byParent[n.parent || '-'] = byParent[n.parent || '-'] || []).push(n); });
  const dag = $('#dag'); dag.innerHTML = '';
  const root = S.nodes.find(n => n.id === 'orchestrator');
  const place = (n, host) => {
    const row = document.createElement('div'); row.className = 'row';
    row.appendChild(nodeEl(n)); host.appendChild(row);
    const kids = byParent[n.id] || [];
    if (kids.length){
      const box = document.createElement('div'); box.className = 'kids';
      const r = document.createElement('div'); r.className = 'row';
      kids.forEach(k => r.appendChild(nodeEl(k)));
      box.appendChild(r); host.appendChild(box);
      kids.forEach(k => { if ((byParent[k.id] || []).length) place(k, box); });
    }
  };
  if (root) place(root, dag); else dag.innerHTML = '<div class="empty">no work yet</div>';

  const c = S.counters;
  $('#counts').textContent =
    `${c.flags} departures . ${c.checks} unanswered checks . ${c.unseen_files} files you have not opened`
    + ` . outdatedness ${c.total} of ${c.threshold}`;
  $('#since').textContent = c.minutes_since_look ? `since your last look (${c.minutes_since_look} min)`
                                                 : 'since you last looked';
  $('#mode').textContent = `q4 ${S.settings.involvement} . q5 ${S.settings.threshold}`;

  const it = $('#items'); it.innerHTML = '';
  if (!S.items.length) it.innerHTML = '<div class="empty">nothing waiting for you</div>';
  S.items.forEach(i => {
    const el = document.createElement('div'); el.className = 'item';
    const badge = i.kind === 'flag' ? '<span class="badge" style="background:var(--depart)">!</span>'
                : i.kind === 'check' ? '<span class="badge" style="background:var(--guess)">?</span>'
                : i.kind === 'finished' ? '<span class="badge" style="background:var(--fit)">&#10003;</span>'
                : '<span class="badge" style="background:var(--accent)">+</span>';
    el.innerHTML = `<div class="t">${badge}${esc(i.title)}</div><div class="c">${esc(i.caption)}</div>` +
      (i.if_accepted ? `<div class="acc">accept adds to your lines: "${esc(i.if_accepted)}"</div>` : '');
    if (i.kind === 'flag' || i.kind === 'check'){
      const accept = document.createElement('button'); accept.textContent = 'accept';
      accept.onclick = () => post('/answer', {rid:i.rid, dkey:i.dkey, answer:'accept',
                                              lines:i.lines, if_accepted:i.if_accepted, caller:i.caller});
      const no = document.createElement('button'); no.textContent = 'no, tell the parent'; no.className = 'pri';
      const box = document.createElement('div'); box.style.display = 'none';
      const ta = document.createElement('textarea'); ta.rows = 3;
      ta.placeholder = 'note to ' + i.title.split(' ->')[0] + ', delivered at its next step';
      const send = document.createElement('button'); send.textContent = 'send';
      send.onclick = () => post('/answer', {rid:i.rid, dkey:i.dkey, answer:'no', note:ta.value,
                                            lines:i.lines, caller:i.caller});
      no.onclick = () => { box.style.display = 'block'; ta.focus(); };
      box.appendChild(ta); box.appendChild(send);
      el.appendChild(accept); el.appendChild(no); el.appendChild(box);
    }
    it.appendChild(el);
  });

  $('#lines').innerHTML = S.lines.map(l =>
    `<div><span class="id">${esc(l.id)}</span> ${esc(l.text)}`
    + (String(l.status || '').startsWith('superseded') ? ' <span style="color:var(--dim)">(superseded)</span>' : '')
    + `</div>`).join('') || '<div class="empty">no lines yet; run ctl.py init</div>';

  const j = S.judgements, b = {hold:0, check:0, silent:0};
  j.forEach(x => b[x.band] = (b[x.band] || 0) + 1);
  $('#sum').textContent = `${j.length} judgements . ${b.hold||0} held . ${b.check||0} checks . ${b.silent||0} silent`;
}

function caughtUp(){ post('/caught-up', {}); }
load(); setInterval(load, 4000);
</script>
</body>
</html>
